<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div id="container">
        <div id="screen-container">
            <div class="screen">
                <span class="content"></span>
            </div>
        </div>
        <div id="button-container">

        <div id="first-row">
            <button class="delete" id="clear">CLEAR</button>
            <button class="delete" id="back">←</button>
             <button class="operators" id="divide">/</button>
        </div>

        <div id="second-row">
            <button class="numbers" id="7">7</button>
            <button class="numbers" id="8">8</button>
            <button class="numbers" id="9">9</button>
            <button class="operators" id="multiply">*</button>
        </div>

        <div id="third-row">
            <button class="numbers" id="4">4</button>
            <button class="numbers" id="5">5</button>
            <button class="numbers" id="6">6</button>
            <button class="operators" id="subtract">-</button>
        </div>

        <div id="fourth-row">
            <button class="numbers" id="1">1</button>
            <button class="numbers" id="2">2</button>
            <button class="numbers" id="3">3</button>
            <button class="operators" id="add">+</button>
        </div>

        <div id="fifth-row">
            <button class="numbers" id="0">0</button>
            <button class="operators" id="decimal">.</button>
            <button class="operators" id="equals">=</button>
        </div>
        </div>
    </div>
</body>
</html>
