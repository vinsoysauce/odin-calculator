<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div id="container">
        <div id="box">

            <div id="screen-container">
                <div class="screen"></div>
            </div>
            <div id="button-container">

                <div id="first-row">
                    <button>C</button>
                    <button>X</button>
                    <button>%</button>
                    <button>/</button>
                </div>

                <div id="second-row">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>*</button>
                </div>

                <div id="third-row">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>-</button>
                </div>

                <div id="fourth-row">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>+</button>
                </div>

                <div id="fifth-row">
                    <button>0</button>
                    <button>.</button>
                    <button class="equals">=</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
