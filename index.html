<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div id="container">
        <div id="box">
            <div id="screen-container">
                <div class="screen"></div>
            </div>
            <div id="button-container">
                <div class="C"><button>C</button></div>
                <div class="X"><button>X</button></div>
                <div class="%"><button>%</button></div>
                <div class="/"><button>/</button></div>
                <div class="7"><button>7</button></div>
                <div class="8"><button>8</button></div>
                <div class="9"><button>9</button></div>
                <div class="*"><button>*</button></div>
                <div class="4"><button>4</button></div>
                <div class="5"><button>5</button></div>
                <div class="6"><button>6</button></div>
                <div class="-"><button>-</button></div>
                <div class="1"><button>1</button></div>
                <div class="2"><button>v</button></div>
                <div class="3"><button>3</button></div>
                <div class="+"><button>+</button></div>
                <div class="0"><button>0</button></div>
                <div class="."><button>.</button></div>
                <div class="="><button>=</button></div>
            </div>
        </div>
    </div>
</body>
</html>
